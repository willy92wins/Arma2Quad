class CfgSkeletons
{
	class Arma2Quad_body_Skeleton
	{
		// Discrete (rigid) section animation matches the source ATV skeleton
		// (LFQuad2_dev/_recovered/model.cfg.autogen:8). Non-discrete blending
		// does not apply: this mesh has no gradual cable weights.
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] =
		{
			"wheel_1_1_damper", "",
			"wheel_1_1_steering", "wheel_1_1_damper",
			"wheel_1_1", "wheel_1_1_steering",
			"wheel_2_1_damper", "",
			"wheel_2_1_steering", "wheel_2_1_damper",
			"wheel_2_1", "wheel_2_1_steering",
			"wheel_1_2_damper", "",
			"wheel_1_2", "wheel_1_2_damper",
			"wheel_2_2_damper", "",
			"wheel_2_2", "wheel_2_2_damper",
			"crewdriver", "",
			"crewcodriver", "",
			"drivewheel", "",
			"dial_speed", "drivewheel",
			"dial_rpm", "drivewheel",
			"fuel", "drivewheel"
		};
	};
};

