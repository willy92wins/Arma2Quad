				angle1 = "rad 360";
			};
			class damper_2_2
			{
				type = "translation";
				source = "damper_2_2";
				selection = "wheel_2_2_damper";
				axis = "wheel_2_2_damper_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -0.35;
				offset1 = 0.35;
			};
			class wheelbackright
			{
				type = "rotation";
				source = "wheelbackright";
				sourceAddress = "loop";
				selection = "wheel_2_2";
				axis = "wheel_2_2_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad 360";
			};
			class drivingwheel
			{
				type = "rotation";
				source = "steeringwheel";
				selection = "drivewheel";
				axis = "drivewheel_axis";
				memory = 1;
				minValue = -1;
				maxValue = 1;
				// Grips sit 0.381 m from the axis, so this sweep sets how far they travel
				// fore and aft: +-15 deg moves them +-98 mm, +-22.5 deg +-146 mm, +-25 deg
				// +-161 mm and +-30 deg +-190 mm. Judged in game against the seated rider's
				// arms over three passes: 30 overshot the hands, 15 fell clearly short, and
				// 22.5 read close but still trailed them, so the sweep is taken to 25. The
				// vertical mismatch was a separate defect, already fixed by making
				// drivewheel_axis exactly vertical; at 3.4 deg off it raised one grip and
				// lowered the other by 11.5 mm at the stops.
				// Provisional. The definitive value is not an eye fit: it must equal the
				// steerMax of the rider pose that drives the hand IK, or the hands lose
				// contact at full lock (LL-handlebar-rotation-sync). The pose here is anim
				// instance 22, QuadBike, from @SurvivorAnims.
				angle0 = "rad -25";
				angle1 = "rad 25";
			};
			class IndicatorSpeed
			{
				// Engine source, km/h (GetSpeedometer, scripts/3_game/vehicles/car.c:113).
				// Screen angles are measured in a frame whose right is READ from the model,
				// light_right - light_left, which is -X on this chassis. A right taken from a
				// cross product lands on the rider's LEFT here and mirrors the face and every
				// angle derived with it. The printed face is linear over 0-100 at 2.0194 deg
				// per km/h (1.88 deg residual across its 11 major ticks) and compresses to
				// 15.5 deg per 10 km/h above 110, so the fit is taken from the linear range
				// and extrapolated: past 100 the needle reads a few km/h optimistic. angle0 is
				// the needle rest angle minus the screen angle of the painted zero, both in
				// that frame; a positive sweep turns the needle clockwise for the rider. Every
				// angle carries its unit: a bare number is read as radians.
				type = "rotation";
				source = "speed";
				selection = "dial_speed";
				axis = "dial_speed_axis";
				memory = 1;
				minValue = 0;
				maxValue = 150;
				angle0 = "rad 102.55";
				angle1 = "rad 405.45";
			};
			class IndicatorFuel
			{
				// Engine source, 0..1 over the tank. `fuel` is a native model.cfg source:
				// offroadhatchback and civiliansedan both drive dial_fuel with it and
				// neither goes through a script AnimationSource. Absence on the script
				// side is not absence in the engine.
				// The gauge sits BELOW the two dials on one flat panel. That panel is the
				// quad that used to carry only the fuel face, grown to 172 x 86 mm on the
				// dial plane (Z = -0.76797*Y + 0.76663, tilted 50.8 deg) and pushed 1.5 mm
				// behind the discs. Its texture keeps the name Arma2Quad_dial_fuel_co.paa but
				// now carries the whole panel art, rim included. The discs rose 25.6 mm and
				// the gauge dropped as ONE rigid body with its pivot, which preserves the
				// pivot 17.1 mm below the needle: the needle reads as a short pointer over
				// the arc, not a full needle from a hub. Moving needle and pivot separately
				// would leave it spinning about its own centre.
				// The two discs are not background: they are 32 faces each with their own
				// texture, sitting in front. The pod surface below them is not a readable
				// plane anyway -- a column 18.2 x 23.7 x 79.8 mm at X~0 turns with the bars
				// (44 of its 48 points are in `drivewheel`; an earlier note here called it
				// an ignition barrel, which it is not).
				// Printed scale: E at 130.0 deg and F at 48.5 deg about the pivot, redrawn
				// to those exact angles so angle0 and angle1 carry over unmeasured. Needle
				// mesh built at 90 deg, hence angle0 = 90 - 130 and angle1 = 90 - 48.5,
				// sweep +81.5. The art is drawn at 11.907 px/mm across and 9.410 px/mm
				// down, because the panel is foreshortened: a circle on it is an ellipse in
				// the atlas.
				// The needle takes its colour from a single texel and now samples the red
				// patch in Arma2Quad_dial_co.paa, which no geometry maps to, so the panel art
				// carries no patch of its own.
				type = "rotation";
				source = "fuel";
				selection = "fuel";
				axis = "fuel_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad -40.0";
				angle1 = "rad 41.5";
			};
			class IndicatorRPM
			{
				// Engine source, normalised over EngineGetRPMMax
				// (scripts/5_mission/gui/vehicles/carhud.c:104). No vanilla config declares
				// rpmMax; carhud.c:89 divides rpmRedline by it, so the ceiling is not the
				// redline but the last torqueCurve point, 6400 here. The printed face runs 0-6
				// at 38.0018 deg per 1000 rpm, so maxValue 1.0 is 6.4 printed units and the
				// sweep is 243.21 deg; the needle reaches the red arc only near the ceiling.
				// Same anchored frame and sign convention as IndicatorSpeed.
				type = "rotation";
				source = "rpm";
				selection = "dial_rpm";
				axis = "dial_rpm_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = "rad 71.95";
				angle1 = "rad 315.16";
			};

		};
	};
};
