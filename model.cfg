				axis = "wheel_2_1_damper_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				offset0 = -0.35;
				offset1 = 0.35;
			};
			class wheelfrontright
			{
				type = "rotation";
				source = "wheelfrontright";
				sourceAddress = "loop";
				selection = "wheel_2_1";
				axis = "wheel_2_1_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = "rad 360";
			};
			class damper_1_2
			{
				type = "translation";
				source = "damper_1_2";
				selection = "wheel_1_2_damper";
				axis = "wheel_1_2_damper_axis";
				memory = 1;
